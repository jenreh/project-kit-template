[extend]
useDefault = true

[[allowlists]]
description = "Allowlist for uv, reflex.dev, and DB migrations"
paths = [
    # --- UV Specifics ---
    '''uv\.lock''',       # Essential: uv lockfile hashes look like secrets
    '''\.venv/.*''',      # Just in case venv isn't in .gitignore
    '''\.venv\.mac/.*''', # Just in case venv isn't in .gitignore

    # --- Reflex.dev Specifics ---
    '''\.web/.*''',     # Reflex compiled frontend artifacts
    '''assets/.*''',    # Static assets (images/fonts) can trigger entropy checks
    '''rxconfig\.py''', # Config often has non-sensitive keys flagged

    # --- DB Migrations (random revision IDs look like secrets) ---
    '''alembic/versions/.*''', # Alembic migration scripts
    '''runic/versions/.*''',   # Runic graph migration scripts

    # --- Standard Python ---
    '''tests/.*''',
    '''__pycache__/.*''',
]
fingerprints = [
    # Local development secrets in .env
    #".env:generic-api-key:13",
]
