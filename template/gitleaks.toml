[extend]
useDefault = true

[[allowlists]]
description = "Generated files and binary assets"
paths = [
    # --- UV Specifics ---
    '''uv\.lock''',       # Essential: uv lockfile hashes look like secrets
    '''\.venv/.*''',      # Just in case venv isn't in .gitignore
    '''\.venv\.mac/.*''', # Just in case venv isn't in .gitignore

    # --- Reflex.dev Specifics ---
    '''\.web/.*''',                  # Reflex compiled frontend artifacts
    '''assets/(img|icons)/.*''',     # Images can trigger entropy checks
    '''assets/favicon\.ico''',

    # --- Standard Python ---
    '''__pycache__/.*''',
]

[[allowlists]]
description = "References to the secret provider, which hold no secret value"
regexTarget = "match"
regexes = ['''secret:[a-zA-Z0-9\-_]+''']
