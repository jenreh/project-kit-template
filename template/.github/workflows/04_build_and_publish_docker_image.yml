name: 04 Build and Publish GHCR Image on Release

on:
  release:
    types: [published]
  # Manual runs rebuild an existing release: start them from a tag (Use workflow
  # from -> Tags). Runs started from a branch are skipped, so no branch can push.
  workflow_dispatch:

# Restrict the default token and grant only what's needed
permissions:
  contents: read

concurrency:
  group: release-docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image to GitHub Packages (GHCR)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # secrets.GITHUB_TOKEN is auto-generated per workflow run and inherits these
    # permissions. For pushing to GHCR, packages: write is required.
    permissions:
      contents: read
      packages: write
    # Publish under the org's GHCR namespace; keep image name lowercase
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # The version from the tag (v1.2.3 -> 1.2.3). 'latest' only moves on a
          # published, non-prerelease release, never on a manual rebuild.
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Build and push image (release tag and latest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance and an SBOM attestation travel with the image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
