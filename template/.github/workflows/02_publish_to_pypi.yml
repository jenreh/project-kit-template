name: 02 Build and Publish Artifacts/Libs on Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      - name: UV Build
        run: uv build

      - name: Upload the distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # Add this environment and a trusted publisher on PyPI before the first release:
    # https://docs.pypi.org/trusted-publishers/ . No API token is stored in the repo,
    # and only this job, which runs no project code, can request the OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      - name: Download the distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
