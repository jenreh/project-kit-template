_subdirectory: template
_templates_suffix: .jinja
_preserve_symlinks: true
_envops:
  keep_trailing_newline: true

# ─── Questions ────────────────────────────────────────────────────────────────

project_name:
  type: str
  help: Project / distribution name (kebab-case, e.g. voyager)
  # Answers end up in shell commands and TOML/YAML files, so they are validated.
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_name must be kebab-case: lower case letters, digits and hyphens
    {% endif %}

project_type:
  type: str
  help: What kind of project is this?
  choices:
    "Python-only (CLI / library / service)": python
    "reflex.dev / AppKit web app": reflex
  default: python

package_name:
  type: str
  help: Python import package (snake_case)
  default: "{{ project_name.replace('-', '_') }}"
  when: "{{ project_type == 'python' }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z_][a-z0-9_]*$')) %}
    package_name must be snake_case: lower case letters, digits and underscores
    {% elif project_type == 'python' and package_name == 'app' %}
    package_name cannot be 'app' for a Python project (collides with the reflex app dir)
    {% endif %}

project_description:
  type: str
  help: One-line project description
  default: "A {{ 'reflex.dev / AppKit web' if project_type == 'reflex' else 'Python' }} application."
  validator: >-
    {% if project_description | regex_search('["\\\n]') %}
    project_description cannot contain double quotes, backslashes or line breaks
    {% endif %}

author_name:
  type: str
  default: Jens Rehpöhler
  validator: >-
    {% if author_name | regex_search('["\\\n]') %}
    author_name cannot contain double quotes, backslashes or line breaks
    {% endif %}

github_owner:
  type: str
  default: jenreh
  validator: >-
    {% if not (github_owner | regex_search('^[A-Za-z0-9][A-Za-z0-9-]*$')) %}
    github_owner must be a GitHub user or organization name
    {% endif %}

python_version:
  type: str
  help: Python version (major.minor) — kept as a string so 3.1 and 3.10 never collide
  choices:
    "3.15": "3.15"
    "3.14": "3.14"
  default: "3.14"

include_db:
  type: bool
  help: Add SQL database deps (sqlalchemy/alembic/psycopg). Reflex always includes the full DB layer.
  default: false
  when: "{{ project_type == 'python' }}"

db_name:
  type: str
  help: Postgres database name
  default: "{{ project_name }}-db"
  when: "{{ project_type == 'reflex' or include_db }}"
  validator: >-
    {% if not (db_name | regex_search('^[A-Za-z0-9][A-Za-z0-9_-]*$')) %}
    db_name can only contain letters, digits, hyphens and underscores
    {% endif %}

use_devcontainer:
  type: bool
  help: Include the .devcontainer/ setup (works for any project type)
  default: true

include_docker:
  type: bool
  help: Include Docker tooling (Dockerfile + compose for reflex; docker task otherwise)
  default: "{{ project_type == 'reflex' }}"

devcontainer_docker:
  type: bool
  help: >-
    Give the dev container the host Docker daemon (docker-outside-of-docker)? Everything
    in the container, coding agents included, then has root access to the host. Without
    it, run the docker tasks on the host.
  default: false
  when: "{{ use_devcontainer and include_docker }}"

include_terraform:
  type: bool
  help: Include the terraform/ scaffold + cloud deploy task
  default: false

cloud_provider:
  type: str
  help: Which cloud should the terraform scaffold target?
  choices:
    Azure: azure
    AWS: aws
  default: azure
  when: "{{ include_terraform }}"

include_docs:
  type: bool
  help: Include a docs/ folder for plain Markdown documentation
  default: "{{ project_type == 'python' }}"

include_graph:
  type: bool
  help: Add GraphDB / runic-py (graph schema migrations + OGM for Cypher DBs)
  default: false

coding_agents:
  type: str
  help: Which coding agents do you use? (CLI + VS Code extension in the dev container, plugin install via `task agents:plugins`)
  multiselect: true
  choices:
    Claude Code: claude
    GitHub Copilot: copilot
    OpenAI Codex: codex
  default: [claude]

agent_plugins:
  type: str
  help: Which plugin marketplaces should the agents install? (listed in .claude/settings.json)
  multiselect: true
  choices:
    "jenreh/agent-skills (Python, Reflex, design, Terraform, GraphDB skills)": jenreh
    "obra/superpowers (brainstorm, plan, TDD and debugging workflows)": superpowers
    "mattpocock/skills (TDD, domain modeling, code review, prototyping)": mattpocock
  default: [jenreh]
  when: "{{ coding_agents | length > 0 }}"

create_github_repo:
  type: bool
  help: >-
    Create the GitHub repo, push the project and apply the GitHub baseline (rulesets,
    branch protection, security + Advanced Security; needs an authenticated `gh`)
  default: false

github_visibility:
  type: str
  help: Visibility for the new GitHub repo
  choices:
    Private: private
    Public: public
  default: private
  when: "{{ create_github_repo }}"

# ─── File selection ───────────────────────────────────────────────────────────
# _exclude replaces Copier's defaults, so VCS/OS/build junk is re-listed first,
# then each conditional pattern renders to "" (matches nothing) when its feature
# is enabled. The python package lives in a whole-segment conditional directory
# ({% raw %}{% if project_type == 'python' %}{{ package_name }}{% endif %}{% endraw %})
# and vanishes for reflex, so it is not listed here.
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".svn"
  - ".DS_Store"
  - ".venv*"
  - ".cache"
  - ".coverage"
  - "coverage.xml"
  - "node_modules"
  - ".web"
  - ".states"
  - "dist"
  - ".pytest_cache"
  - ".mypy_cache"
  - ".ruff_cache"
  # All conditional patterns are ROOT-ANCHORED (leading /) so they never catch a
  # nested path of the same name (e.g. a nested taskfiles/, .devcontainer/Dockerfile).
  # reflex-only layer
  - "{% if project_type != 'reflex' %}/app{% endif %}"
  - "{% if project_type != 'reflex' %}/rxconfig.py{% endif %}"
  - "{% if project_type != 'reflex' %}/configuration{% endif %}"
  - "{% if project_type != 'reflex' %}/assets{% endif %}"
  - "{% if project_type != 'reflex' %}/components{% endif %}"
  - "{% if project_type != 'reflex' %}/.env.default{% endif %}"
  # github workflows: docker-publish ↔ include_docker; pypi-publish ↔ python libs
  - "{% if not include_docker %}/.github/workflows/01_build_and_publish_docker_image.yml{% endif %}"
  - "{% if project_type != 'python' %}/.github/workflows/02_publish_to_pypi.yml{% endif %}"
  # python-only smoke test imports the python package
  - "{% if project_type != 'python' %}/tests/test_smoke.py{% endif %}"
  # database / alembic: shipped for reflex or python+include_db. env.py.jinja renders a
  # reflex (appkit) or a pure variant, so Taskfile.db.yml works for both. The seeded
  # appkit migration is reflex-only.
  - "{% if not (project_type == 'reflex' or include_db) %}/alembic{% endif %}"
  - "{% if not (project_type == 'reflex' or include_db) %}/alembic.ini{% endif %}"
  - "{% if project_type != 'reflex' %}/alembic/versions/2025_12_30_appkit_user_0.10.0.py{% endif %}"
  - "{% if project_type != 'reflex' %}/alembic/versions/2026_11_02_appkit_user_1.18.0.py{% endif %}"
  # docker (root files only; .devcontainer/ Dockerfile + compose are separate)
  - "{% if not (project_type == 'reflex' and include_docker) %}/Dockerfile{% endif %}"
  - "{% if not (project_type == 'reflex' and include_docker) %}/docker-compose.yml{% endif %}"
  - "{% if not (project_type == 'reflex' and include_docker) %}/start.sh{% endif %}"
  # .dockerignore ships for any include_docker (its contents branch on project_type).
  - "{% if not include_docker %}/.dockerignore{% endif %}"
  # devcontainer (available for any project type)
  - "{% if not use_devcontainer %}/.devcontainer{% endif %}"
  # terraform — taskfiles/Taskfile.terraform.yaml always ships and is switched on via
  # the includes block in Taskfile.dist.yml. terraform/deploy.py is rendered for the
  # chosen cloud_provider, so only the terraform/ scaffold itself is gated.
  - "{% if not include_terraform %}/terraform{% endif %}"
  # docs site
  - "{% if not include_docs %}/docs{% endif %}"
  # coding agents: the plugin installer only ships when an agent was chosen
  - "{% if not coding_agents %}/scripts/install_agent_plugins.py*{% endif %}"

# ─── Post-generation ──────────────────────────────────────────────────────────

_message_after_copy: |
  Project "{{ project_name }}" ({{ project_type }}) created.
  {% if create_github_repo %}
  GitHub: {{ github_visibility }} repo https://github.com/{{ github_owner }}/{{ project_name }}
  created (if gh was authenticated), with the rulesets from BRANCHING.md and the
  security settings applied. The output above lists what this
  plan supports.
  {% else %}
  Publish later (creates the repo, pushes, and applies the rulesets and security
  settings):
    git add -A && git commit -m "Initial commit from kit-template"
    uv run python scripts/github_publish.py {{ github_owner }}/{{ project_name }} private
  {% endif %}
  Next:
    cd {{ _copier_conf.dst_path }}
    task init
    {% if project_type == 'reflex' -%}
    # reflex needs Postgres + secrets first:
    #   cp .env.default .env  (set mn-db-* ; DB name: {{ db_name }})
    #   start Postgres, create the DB, then: task db:upgrade
    # there are no default accounts. Set mn-admin-email + mn-admin-password in .env, then:
    #   task admin:bootstrap && task run
    {%- else -%}
    task test
    {%- endif %}
  {% if coding_agents %}
  Agents: {{ coding_agents | join(', ') }}.
  {%- if agent_plugins %}
  .claude/settings.json lists the plugin marketplaces ({{ agent_plugins | join(', ') }}).
  `task init` (and every dev container attach) runs `task agents:plugins`, which
  installs them into each chosen agent CLI found on PATH.
  {%- endif %}
  Project-specific skills go in .agents/skills (.claude/skills links to it).
  {% endif %}
  {% if include_graph %}
  GraphDB: runic-py (graph migrations + OGM) is in your dependencies
  {%- if coding_agents and 'jenreh' in agent_plugins %}, and the
  runic-migrate / runic-ogm skills come with the jenreh-graphdb plugin{% endif %}.
  {% endif %}

# Commands are argument lists (no shell), so they also run on Windows.
_tasks:
  # Make the generated project a git repo so pre-commit (and copier update) work.
  # Re-running git init on an existing repo is safe; -c keeps it quiet on update.
  - ["git", "-c", "init.defaultBranch=main", "init", "-q"]
  - ["uv", "sync"]
  # github_publish.py pushes the local history, so it needs a commit.
  - command: ["git", "add", "-A"]
    when: "{{ create_github_repo }}"
  - command: ["git", "commit", "-q", "-m", "Initial commit from kit-template"]
    when: "{{ create_github_repo }}"
  # Optional: create the GitHub repo, push, then apply branch protection, the
  # BRANCHING.md rulesets (.github/rulesets/) and security / Advanced Security.
  # On failure the script prints how to finish; `|| echo` (valid in sh and cmd.exe)
  # keeps a failed publish from aborting the generation.
  - command: >-
      uv run --no-sync python scripts/github_publish.py
      {{ github_owner }}/{{ project_name }} {{ github_visibility }}
      || echo GitHub publishing did not finish, see the message above.
    when: "{{ create_github_repo }}"
